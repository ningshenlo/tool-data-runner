x-runner-base: &runner-base
  build:
    context: .
    dockerfile: Dockerfile
  image: sigpik-tool-data-runner:${RUNNER_IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

x-common-environment: &common-environment
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
  CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
  RUNNER_VERSION: ${RUNNER_VERSION:-dev}
  RUNNER_LOG_LEVEL: ${RUNNER_LOG_LEVEL:-info}
  RUNNER_MAX_RETRIES: ${RUNNER_MAX_RETRIES:-2}

services:
  periodic-facts-worker:
    <<: *runner-base
    command:
      - python
      - runner.py
      - --periodic-facts
      - --loop
      - --interval-seconds
      - ${RUNNER_FACTS_POLL_INTERVAL_SECONDS:-300}
    environment:
      <<: *common-environment
      RUNNER_SERVICE_NAME: periodic-facts-worker
      RUNNER_INSTANCE_ID: ${PERIODIC_FACTS_RUNNER_INSTANCE_ID:-periodic-facts-worker}
      RUNNER_LIMIT: ${RUNNER_LIMIT:-500}
      RUNNER_TRAFFIC_CONCURRENCY: ${RUNNER_TRAFFIC_CONCURRENCY:-5}
      RUNNER_DOMAIN_CONCURRENCY: ${RUNNER_DOMAIN_CONCURRENCY:-5}
      RUNNER_DOMAIN_STATE_LIMIT: ${RUNNER_DOMAIN_STATE_LIMIT:-50}
      RUNNER_DOMAIN_STATE_MAX_AGE_DAYS: ${RUNNER_DOMAIN_STATE_MAX_AGE_DAYS:-30}
      RUNNER_DOMAIN_POLL_INTERVAL_SECONDS: ${RUNNER_DOMAIN_POLL_INTERVAL_SECONDS:-1}
      RUNNER_AHREFS_REQUESTS_PER_MINUTE: ${RUNNER_AHREFS_REQUESTS_PER_MINUTE:-60}
      TRAFFIC_RELEASE_PROBE_DOMAIN: ${TRAFFIC_RELEASE_PROBE_DOMAIN:-chatgpt.com}
      TRAFFIC_RELEASE_PROBE_START_DAY: ${TRAFFIC_RELEASE_PROBE_START_DAY:-7}
      TRAFFIC_RELEASE_PROBE_INTERVAL_SECONDS: ${TRAFFIC_RELEASE_PROBE_INTERVAL_SECONDS:-21600}
      TRAFFIC_RELEASE_QUEUE_LIMIT: ${TRAFFIC_RELEASE_QUEUE_LIMIT:-5000}
      AHREF_API_KEY: ${AHREF_API_KEY:-}
      BRIGHTDATA_PROXY_HOST: ${BRIGHTDATA_PROXY_HOST:-brd.superproxy.io}
      BRIGHTDATA_PROXY_PORT: ${BRIGHTDATA_PROXY_PORT:-33335}
      BRIGHTDATA_PROXY_USER: ${BRIGHTDATA_PROXY_USER}
      BRIGHTDATA_PROXY_PASSWORD: ${BRIGHTDATA_PROXY_PASSWORD}

  assets-worker:
    <<: *runner-base
    command:
      - python
      - runner.py
      - --assets
      - --loop
      - --interval-seconds
      - ${RUNNER_ASSET_POLL_INTERVAL_SECONDS:-150}
    environment:
      <<: *common-environment
      RUNNER_SERVICE_NAME: assets-worker
      RUNNER_INSTANCE_ID: ${ASSETS_RUNNER_INSTANCE_ID:-assets-worker}
      RUNNER_ASSET_LIMIT: ${RUNNER_ASSET_LIMIT:-5}
      RUNNER_ASSET_CONCURRENCY: ${RUNNER_ASSET_CONCURRENCY:-5}
      CLOUDFLARE_BROWSER_RENDERING_API_TOKEN: ${CLOUDFLARE_BROWSER_RENDERING_API_TOKEN:-}
      CLOUDFLARE_WORKERS_AI_API_TOKEN: ${CLOUDFLARE_WORKERS_AI_API_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CATEGORY_CLASSIFICATION_MODEL: ${CATEGORY_CLASSIFICATION_MODEL:-deepseek/deepseek-v4-flash}
      CATEGORY_CLASSIFICATION_FALLBACK_MODEL: ${CATEGORY_CLASSIFICATION_FALLBACK_MODEL:-workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      CATEGORY_MAIN_CONTENT_MAX_CHARS: ${CATEGORY_MAIN_CONTENT_MAX_CHARS:-10000}
      CATEGORY_DEEPSEEK_MAX_OUTPUT_TOKENS: ${CATEGORY_DEEPSEEK_MAX_OUTPUT_TOKENS:-1024}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-sitesimgs}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.sigpik.com}

  pricing-monitor-worker:
    <<: *runner-base
    deploy:
      replicas: ${PRICING_MONITOR_REPLICAS:-0}
    command:
      - python
      - runner.py
      - --pricing
      - --loop
      - --interval-seconds
      - ${RUNNER_PRICING_POLL_INTERVAL_SECONDS:-900}
    environment:
      <<: *common-environment
      RUNNER_SERVICE_NAME: pricing-monitor-worker
      RUNNER_INSTANCE_ID: ${PRICING_RUNNER_INSTANCE_ID:-pricing-monitor-worker}
      PRICING_MONITOR_ENABLED: ${PRICING_MONITOR_ENABLED:-0}
      RUNNER_PRICING_LIMIT: ${RUNNER_PRICING_LIMIT:-20}
      RUNNER_PRICING_CONCURRENCY: ${RUNNER_PRICING_CONCURRENCY:-5}
      RUNNER_PRICING_TIMEOUT_SECONDS: ${RUNNER_PRICING_TIMEOUT_SECONDS:-20}
      RUNNER_PRICING_MANUAL_REVIEW_REPLAY_LIMIT: ${RUNNER_PRICING_MANUAL_REVIEW_REPLAY_LIMIT:-5}
      PRICING_CLAIMS_SHADOW: ${PRICING_CLAIMS_SHADOW:-0}
      PRICING_CLAIMS_PUBLISH: ${PRICING_CLAIMS_PUBLISH:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API: ${OPENAI_API:-}
      OPENAI_PRICING_MODEL: ${OPENAI_PRICING_MODEL:-gpt-5.6-luna}
      OPENAI_PRICING_FALLBACK_MODEL: ${OPENAI_PRICING_FALLBACK_MODEL:-}
      OPENAI_PRICING_TIMEOUT_SECONDS: ${OPENAI_PRICING_TIMEOUT_SECONDS:-45}
      OPENAI_PRICING_TEXT_CHARS: ${OPENAI_PRICING_TEXT_CHARS:-24000}
      CLOUDFLARE_BROWSER_RENDERING_ENABLED: ${CLOUDFLARE_BROWSER_RENDERING_ENABLED:-0}
      CLOUDFLARE_BROWSER_RENDERING_API_TOKEN: ${CLOUDFLARE_BROWSER_RENDERING_API_TOKEN:-}
      CLOUDFLARE_BROWSER_RENDERING_TIMEOUT_SECONDS: ${CLOUDFLARE_BROWSER_RENDERING_TIMEOUT_SECONDS:-45}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-sitesimgs}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://img.sigpik.com}

  sitemap-monitor-worker:
    <<: *runner-base
    deploy:
      replicas: ${SITEMAP_MONITOR_REPLICAS:-0}
    command:
      - python
      - -m
      - sitemap_monitor
      - --backend
      - cloudflare
      - --loop
      - --require-enabled
      - --interval-seconds
      - ${SITEMAP_MONITOR_POLL_SECONDS:-30}
      - --check-interval-seconds
      - ${SITEMAP_MONITOR_CHECK_INTERVAL_SECONDS:-21600}
      - --batch-size
      - ${SITEMAP_MONITOR_BATCH_SIZE:-25}
      - --max-attempts
      - ${SITEMAP_MONITOR_MAX_ATTEMPTS:-5}
      - --job-lease-seconds
      - ${SITEMAP_MONITOR_JOB_LEASE_SECONDS:-900}
      - --maintenance-interval-seconds
      - ${SITEMAP_MONITOR_MAINTENANCE_INTERVAL_SECONDS:-21600}
      - --run-detail-retention-days
      - ${SITEMAP_MONITOR_RUN_DETAIL_RETENTION_DAYS:-7}
      - --scan-detail-retention-days
      - ${SITEMAP_MONITOR_SCAN_DETAIL_RETENTION_DAYS:-30}
      - --job-retention-days
      - ${SITEMAP_MONITOR_JOB_RETENTION_DAYS:-30}
      - --maintenance-batch-size
      - ${SITEMAP_MONITOR_MAINTENANCE_BATCH_SIZE:-500}
    environment:
      <<: *common-environment
      RUNNER_SERVICE_NAME: sitemap-monitor-worker
      RUNNER_INSTANCE_ID: ${SITEMAP_MONITOR_RUNNER_INSTANCE_ID:-sitemap-monitor-worker}
      SITEMAP_MONITOR_ENABLED: ${SITEMAP_MONITOR_ENABLED:-0}
      SITEMAP_MONITOR_SITES: ${SITEMAP_MONITOR_SITES:-}
      SITEMAP_MONITOR_SITE_FILE: ${SITEMAP_MONITOR_SITE_FILE:-sitemap_monitor/observation-cohort-v1.txt}
      SITEMAP_MONITOR_PAUSED_SITE_FILE: ${SITEMAP_MONITOR_PAUSED_SITE_FILE:-sitemap_monitor/observation-cohort-v1-paused.txt}
      SITEMAP_MONITOR_R2_BUCKET: ${SITEMAP_MONITOR_R2_BUCKET:-sitemap-monitor}
      SITEMAP_MONITOR_SYNTHETIC_DNS_DOH_FALLBACK: ${SITEMAP_MONITOR_SYNTHETIC_DNS_DOH_FALLBACK:-0}
      FOR_ALL_APP_R2_ACCESS_KEY_ID: ${FOR_ALL_APP_R2_ACCESS_KEY_ID}
      FOR_ALL_APP_R2_SECRET_ACCESS_KEY: ${FOR_ALL_APP_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-sitesimgs}

  taxonomy-worker:
    <<: *runner-base
    command: ["python", "runner.py", "--taxonomy", "--loop"]
    environment:
      <<: *common-environment
      RUNNER_SERVICE_NAME: taxonomy-worker
      RUNNER_INSTANCE_ID: ${TAXONOMY_RUNNER_INSTANCE_ID:-taxonomy-worker}
      TAXONOMY_AUTO_ENABLED: ${TAXONOMY_AUTO_ENABLED:-1}
      RUNNER_TAXONOMY_LIMIT: ${RUNNER_TAXONOMY_LIMIT:-50}
      RUNNER_TAXONOMY_INTERVAL_SECONDS: ${RUNNER_TAXONOMY_INTERVAL_SECONDS:-300}
      RUNNER_TAXONOMY_CONCURRENCY: ${RUNNER_TAXONOMY_CONCURRENCY:-3}
      RUNNER_TAXONOMY_PROVIDER_BACKOFF_SECONDS: ${RUNNER_TAXONOMY_PROVIDER_BACKOFF_SECONDS:-21600}
      TAXONOMY_AUTO_ACCEPT_CONFIDENCE: ${TAXONOMY_AUTO_ACCEPT_CONFIDENCE:-0.50}
      CLOUDFLARE_BROWSER_RENDERING_API_TOKEN: ${CLOUDFLARE_BROWSER_RENDERING_API_TOKEN:-}
      CLOUDFLARE_WORKERS_AI_API_TOKEN: ${CLOUDFLARE_WORKERS_AI_API_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CATEGORY_CLASSIFICATION_MODEL: ${CATEGORY_CLASSIFICATION_MODEL:-deepseek/deepseek-v4-flash}
      CATEGORY_CLASSIFICATION_FALLBACK_MODEL: ${CATEGORY_CLASSIFICATION_FALLBACK_MODEL:-workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      CATEGORY_MAIN_CONTENT_MAX_CHARS: ${CATEGORY_MAIN_CONTENT_MAX_CHARS:-10000}
      CATEGORY_DEEPSEEK_MAX_OUTPUT_TOKENS: ${CATEGORY_DEEPSEEK_MAX_OUTPUT_TOKENS:-1024}
