name: Report runtime
on:
  push:
    branches: [agent/reports-github-deploy-20260914, agent/fix-traffic-runner-observability]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-report-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bundle and Compose configuration
        env:
          REPORT_REVIEW_TOKEN: ci-only-placeholder-not-a-real-secret-1234567890
          SIGPIK_DATABASE_URL: postgresql://ci:ci@postgres.invalid/sigpik?sslmode=verify-full
        run: |
          python scripts/sync-report-runtime.py --verify
          for replicas in 0 1; do
            SITEMAP_MONITOR_REPLICAS=$replicas SITEMAP_MONITOR_ENABLED=$replicas docker compose -f docker-compose.dokploy.yml config --format json | python scripts/check-deployment-contract.py --sitemap-replicas "$replicas"
          done
      - name: Build collector and report images
        run: |
          docker build -t report-test-collector .
          docker build -t report-test-renderer -f Dockerfile.reports .
      - name: Test collector entry point and scheduler contracts
        run: |
          docker run --rm --network none report-test-collector python -c "import runner, report_review_api, postgres_client, postgres_legacy, taxonomy_batch, jev_taxonomy, sitemap_monitor.cloudflare"
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo report-test-collector python -m unittest test_market_snapshot_refresh test_search_demand_refresh test_docker_image_contract test_d1_direct_clients tests.test_postgres_deployment tests.test_report_automation tests.test_report_review_api test_taxonomy_precision test_taxonomy_batch test_taxonomy_safety
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo report-test-renderer node --test tests/report-runtime.test.mjs
      - name: Prepare synthetic completion events
        run: |
          docker volume create report-test-exports
          docker volume create report-test-drafts
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/repo:ro" -v report-test-exports:/exports report-test-renderer python /repo/tests/report_smoke.py --prepare
      - name: Render with read-only code and exports, then restart
        run: |
          docker run --rm --hostname sigpik-report-drafts --network none --read-only --tmpfs /tmp:size=256m -v "$PWD:/repo:ro" -v report-test-exports:/exports:ro -v report-test-drafts:/app/work report-test-renderer python /repo/tests/report_smoke.py
      - name: Remove synthetic test volumes
        if: always()
        run: |
          docker volume rm report-test-exports report-test-drafts || true
  promote-production:
    needs: offline-report-smoke
    if: github.ref == 'refs/heads/agent/fix-traffic-runner-observability' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: runner-production-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote only the tested current commit
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer source commit exists; this run will not deploy."
            exit 0
          fi
          # Dokploy watches only this branch. Never force-push or copy an untested HEAD.
          git push origin "${GITHUB_SHA}:refs/heads/deploy/production"
          echo "Promoted tested commit ${GITHUB_SHA} to Dokploy's deployment branch." >> "$GITHUB_STEP_SUMMARY"
